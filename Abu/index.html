<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Piece Set Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="page">

    <h1 class="title">Piece Set Calculator</h1>

    <!-- INPUT CARD -->
    <section class="card">

      <label class="field-label" for="piecesPerSet">Pieces in one set</label>
      <input
        type="number"
        id="piecesPerSet"
        class="field-input"
        placeholder="Example: 12"
        inputmode="numeric"
        min="1"
      >

      <label class="field-label" for="requiredPieces">Required pieces</label>
      <input
        type="number"
        id="requiredPieces"
        class="field-input"
        placeholder="Example: 120"
        inputmode="numeric"
        min="1"
      >

      <!-- Friendly error message, hidden unless needed -->
      <p id="errorMessage" class="error-message" hidden>Please enter valid numbers.</p>

      <div class="button-row">
        <button id="calculateBtn" class="btn btn-primary" type="button">Calculate</button>
        <button id="resetBtn" class="btn btn-secondary" type="button">Reset</button>
      </div>

    </section>

    <!-- RESULT CARD (hidden until a calculation happens) -->
    <section id="resultCard" class="result-card" hidden>

      <p class="result-label">Sets Required</p>
      <p id="resultSets" class="result-number">0 SETS</p>

      <div class="result-details">
        <p id="resultEquation" class="result-line"></p>
        <p id="resultTotalPieces" class="result-line"></p>
      </div>

    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
